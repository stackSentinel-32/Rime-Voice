# Keeps the Render free-tier deployment awake during the hackathon judging window.
# Render spins free web services down after 15 min without inbound traffic (~30s cold
# start on the next hit) — a health ping every 10 min prevents that entirely.
#
# One-time setup after your first Render deploy:
#   GitHub repo -> Settings -> Secrets and variables -> Actions -> Variables tab
#   -> New repository variable: RENDER_URL = https://<your-service>.onrender.com
#
# Minutes are offset (3,13,23...) to avoid the :00/:10 cron congestion on GitHub's
# runners; even with GitHub's scheduling jitter this stays well inside 15 min.
name: Keep Render awake

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch: {}   # manual "Run workflow" button for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        run: |
          if [ -z "${{ vars.RENDER_URL }}" ]; then
            echo "RENDER_URL variable not set — see comment at top of this file."
            exit 0
          fi
          curl -sS -m 30 -o /dev/null -w "pinged ${{ vars.RENDER_URL }}/health -> HTTP %{http_code}\n" \
            "${{ vars.RENDER_URL }}/health" || true
